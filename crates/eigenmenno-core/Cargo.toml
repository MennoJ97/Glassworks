[package]
name = "eigenmenno-core"
version.workspace = true
edition.workspace = true

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# The sparse solver for 2D, and an independent reference for the handwritten 1D solvers.
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse", "sparse-linalg"] }

[dev-dependencies]
serde_json = "1"
