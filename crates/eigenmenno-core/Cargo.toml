[package]
name = "eigenmenno-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# An independent reference for the handwritten solvers.
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse", "sparse-linalg"] }
serde_json = "1"
